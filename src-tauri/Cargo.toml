[package]
name = "cleanmic"
version = "0.2.4"
description = "Gerçek zamanlı mikrofon temizleyici ve efekt pedalboard'u"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
nnnoiseless = "0.5"
ringbuf = "0.4"
symphonia = { version = "0.5", features = ["all"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
# CABLE çıkışını WASAPI özel (exclusive) modda açmak için: ses Windows karıştırıcısından
# geçmez, böylece Discord'un ekran paylaşımı gibi loopback yakalamalarına görünmez.
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Security",
] }

# Ses işleme debug modda bile hızlı olmalı, yoksa takılma (underrun) olur.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
